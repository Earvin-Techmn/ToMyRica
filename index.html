<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotus Love</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ PAGE 1 ============ -->
  <section id="page1" class="page active">
    <header class="header header-dark">
      <span>🌸 I LOVE YOU 🌸</span>
    </header>

    <main class="stage stage-white">
      <div class="center-group">
        <h1 class="float-text text-top">I LOVE YOU</h1>

        <div class="flower-row">
          <img src="leftarrow.png" class="arrow arrow-left" alt="arrow">
          <img src="lotus.png" id="lotus" class="lotus" alt="lotus flower" title="Click me!">
          <img src="rightarrow.png" class="arrow arrow-right" alt="arrow">
        </div>

        <h1 class="float-text text-bottom">VERY MUCH!</h1>
      </div>
    </main>

    <footer class="footer footer-dark"></footer>
  </section>

  <!-- ============ PAGE 2 ============ -->
  <section id="page2" class="page">
    <header class="header header-blue">
      <span>💙 For You My Rica 💙</span>
    </header>

    <main class="stage stage-white scatter">

      <!-- Ribbons -->
      <img src="ribbon.png" class="deco ribbon" style="top:6%; left:3%;" alt="ribbon">
      <img src="ribbon.png" class="deco ribbon ribbon-flip" style="top:5%; right:2%;" alt="ribbon">

      <!-- Flowers -->
      <img src="flower.png" class="deco flower" style="top:58%; left:4%;" alt="flower">
      <img src="flower.png" class="deco flower flower-flip" style="top:58%; right:4%;" alt="flower">

      <!-- Hearts -->
      <img src="heart.png" class="deco heart" style="top:12%; left:20%;" alt="heart">
      <img src="heart.png" class="deco heart" style="top:8%;  left:41%;" alt="heart">
      <img src="heart.png" class="deco heart" style="top:28%; left:56%;" alt="heart">
      <img src="heart.png" class="deco heart" style="top:18%; right:16%;" alt="heart">
      <img src="heart.png" class="deco heart" style="top:56%; left:18%;" alt="heart">
      <img src="heart.png" class="deco heart" style="top:54%; left:43%;" alt="heart">
      <img src="heart.png" class="deco heart" style="top:56%; right:14%;" alt="heart">

    </main>

    <footer class="footer footer-blue"></footer>
  </section>

  <!-- Travel button -->
  <button id="pageToggle" class="page-toggle">Go to Page 2 →</button>

  <script src="script.js"></script>
</body>
</html>
